name: Verify desktop workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PY_PYTHON3: '3.14'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run exact Windows launcher checks
        shell: cmd
        run: |
          py -3 -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 14)"
          Launch-StabilityConsole.bat --self-test
      - name: Exercise real Tk workflow through launcher
        shell: cmd
        env:
          STABILITY_SCREENSHOT_DIR: ${{ github.workspace }}/ui-verification
        run: |
          py -3 -m pip install Pillow==12.0.0
          Launch-StabilityConsole.bat --gui-self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-ui-windows
          path: ui-verification
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run launcher checks
        run: python StabilityConsole-v0.1.0/launch.py --self-test
      - name: Exercise real Tk workflow
        env:
          STABILITY_SCREENSHOT_DIR: ${{ github.workspace }}/ui-verification
        run: |
          python -m pip install Pillow==12.0.0
          xvfb-run -a -s '-screen 0 1600x1000x24' python StabilityConsole-v0.1.0/launch.py --gui-self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-ui-linux
          path: ui-verification
          if-no-files-found: warn
